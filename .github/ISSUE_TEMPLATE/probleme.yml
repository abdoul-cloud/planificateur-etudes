name: Signaler un problème
description: Quelque chose ne marche pas comme prévu
labels: ["problème"]
body:
  - type: markdown
    attributes:
      value: Merci de prendre le temps de signaler ce problème ! N'indiquez aucune information personnelle (clé API, nom complet…).
  - type: textarea
    id: quoi
    attributes:
      label: Que s'est-il passé ?
      description: Décrivez le problème et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: "1. Ouvrir l'écran…  2. Cliquer sur…  3. …"
  - type: input
    id: version
    attributes:
      label: Version de l'application
      description: Affichée en bas du menu de gauche (ex. 0.6.0).
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: "Windows 11"
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran (facultatif)
      description: Vous pouvez glisser une image ici.
