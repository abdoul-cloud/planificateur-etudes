[project]
name = "planificateur-etudes"
version = "0.4.0"
description = "Planificateur personnel des études, hors ligne"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.scripts]
planificateur = "planificateur.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.6", "pillow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
